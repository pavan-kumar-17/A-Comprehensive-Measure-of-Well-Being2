<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Comprehensive Measure of Well-Being</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Well-Being Assessment Tool</h1>
            <p>Enter your lifestyle and health metrics to measure your overall well-being index.</p>
        </header>

        <main>
            <form id="wellbeing-form">
                <!-- User Profile Section -->
                <section class="form-section">
                    <h2>Personal Information</h2>
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" min="1" max="120" placeholder="e.g. 25" required>
                        </div>
                        <div class="input-group">
                            <label for="gender">Gender</label>
                            <select id="gender" required>
                                <option value="" disabled selected>Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Model Features Input Section -->
                <section class="form-section">
                    <h2>Health & Lifestyle Metrics</h2>
                    
                    <div class="input-group">
                        <label for="physicalHealth">Physical Health Rating (1 - 10)</label>
                        <input type="number" id="physicalHealth" min="1" max="10" step="0.1" placeholder="10 = Excellent" required>
                    </div>

                    <div class="input-group">
                        <label for="mentalHealth">Mental Health Rating (1 - 10)</label>
                        <input type="number" id="mentalHealth" min="1" max="10" step="0.1" placeholder="10 = Excellent" required>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="sleepHours">Sleep Duration (Hours/Day)</label>
                            <input type="number" id="sleepHours" min="0" max="24" step="0.5" placeholder="e.g. 7.5" required>
                        </div>
                        <div class="input-group">
                            <label for="stressLevel">Stress Level (1 - 10)</label>
                            <input type="number" id="stressLevel" min="1" max="10" step="0.1" placeholder="10 = High Stress" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="physicalActivity">Activity (Hours/Week)</label>
                            <input type="number" id="physicalActivity" min="0" max="40" step="0.5" placeholder="e.g. 3.5" required>
                        </div>
                        <div class="input-group">
                            <label for="socialSupport">Social Support Score (1 - 10)</label>
                            <input type="number" id="socialSupport" min="1" max="10" step="0.1" placeholder="10 = High Support" required>
                        </div>
                    </div>
                </section>

                <button type="submit" id="submit-btn">Calculate Well-Being Index</button>
            </form>

            <!-- Results Output Section -->
            <section id="results-card" class="results-card hidden">
                <h2>Assessment Results</h2>
                <div class="score-display">
                    <span id="score-value">0.0</span>
                    <span class="score-max">/ 100</span>
                </div>
                <div id="category-badge" class="badge">Moderate</div>
                <p id="result-message"></p>
                <button type="button" id="reset-btn">Take Assessment Again</button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
